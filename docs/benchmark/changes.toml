# Changes in the CoCiP benchmark results, written by hand. generate.py numbers them in release
# order, marks each number on the panels whose value changes at the release (see
# CHANGE_THRESHOLDS in generate.py), and lists them in a table on the page.
#
# release: the first release with the change
# bullets: one reStructuredText item for each separate change, shown as a bulleted list

[[change]]
release = "0.2.0"
bullets = [
    "CoCiP fails for 72 sample flights because of the misspelled parameter ``deafult_thrust``, and the benchmark drops them.",
    "Persistent contrail length is available.",
]

[[change]]
release = "0.3.0"
bullets = [
    "CoCiP attaches ``persistent_1`` and the other initial contrail properties to the first waypoints of each flight instead of the waypoints that satisfy the SAC, so the persistent contrail length is wrong until 0.19.1.",
    "A performance bug in the SAC flight model meteorology handling is fixed, improving memory footprint.",
]

[[change]]
release = "0.6.0"
bullets = [
    "CoCiP computes the solar direct radiation from the solar geometry instead of from the ERA5 TOA incident solar radiation, and shifts the radiation times to the middle of each accumulation hour.",
]

[[change]]
release = "0.7.1"
bullets = [
    "Fix of the ``deafult_thrust`` typo, so the 72 sample flights run again.",
]

[[change]]
release = "0.8.1"
bullets = [
    "CoCiP fails with ``ValueError`` for flights whose waypoints do not intersect the meteorology: 255 sample flights, 229 that previously failed with ``IndexError`` and 26 more.",
]

[[change]]
release = "0.11.0"
bullets = [
    "First release with ``Fleet``-mode. The benchmark runs CoCiP on all flights at once.",
    "The benchmark drops 971 flights that fail in this release.",
    "The results have no persistent contrail length.",
]

[[change]]
release = "0.12.3"
bullets = [
    "Fix of CoCiP running with ``Fleet``-mode: the contrail waypoints are sorted by flight and time after new waypoints are added. Before, the segment joining the older and newer contrail waypoints of each flight was discontinuous, so it had no energy forcing.",
]

[[change]]
release = "0.16.0"
bullets = [
    "BADA3 fuel flow is clipped at every waypoint to the nominal range of its flight phase. Earlier releases corrected only fuel flows above the maximum climb fuel flow or below 0.",
]

[[change]]
release = "0.17.1"
bullets = [
    "36 more flights now run (earlier releases failed for engines whose EDB fuel flows repeat a value).",
]

[[change]]
release = "0.18.0"
bullets = [
    "The wind shear of a partially initialized segment no longer contributes to the plume geometry.",
]

[[change]]
release = "0.19.1"
bullets = [
    "Persistent contrail length is available again.",
    "CoCiP builds a dense (flight * time step * waypoint) array of the contrail output that does not fit in memory, so the benchmark runs CoCiP on 64 batches of flights, one after another. Runtime is the sum over batches.",
]

[[change]]
release = "0.20.2"
bullets = [
    "565 more flights now run. From 0.11.0 to 0.20.1, CoCiP failed for flights whose waypoints are all outside the meteorology but whose engine has an nvPM profile, and the benchmark dropped those flights.",
]

[[change]]
release = "0.22.0"
bullets = [
    "CoCiP copies the full meteorology in ``eval`` instead of when created, which increases the runtime.",
]

[[change]]
release = "0.25.9"
bullets = [
    "New engine thrust setting methodology, based on ECLIF II nvPM measurements, which changes the nvPM number emissions index.",
    "370 more flights now run. Earlier releases failed for piston aircraft, and the benchmark dropped them.",
]

[[change]]
release = "0.26.0"
bullets = [
    "CoCiP selects the meteorology around the flights for initialization and around the contrails at each evolution step, without copying it. This improves runtime.",
]

[[change]]
release = "0.27.0"
bullets = [
    "Humidity scaling becomes a separate model. Before, CoCiP scaled only RHi, with ``rhi_adj = 0.97`` set by the benchmark; now the benchmark passes ``ExponentialBoostLatitudeCorrectionHumidityScaling`` with its defaults, which also scales specific humidity.",
]

[[change]]
release = "0.28.3"
bullets = [
    "CoCiP no longer builds the dense array, so the benchmark now runs all flights in one batch again.",
]

[[change]]
release = "0.28.9"
bullets = [
    "The benchmark sets ``radiative_heating_effects=True``, a CoCiP parameter added in this release.",
]

[[change]]
release = "0.29.0"
bullets = [
    "The EDB is indexed by engine, with 557 engines for gaseous emissions and 178 for nvPM instead of 117 and 47.",
    "This release fails for flights whose engine is missing from its EDB, and the benchmark drops those 2,862 flights.",
]

[[change]]
release = "0.29.1"
bullets = [
    "2,748 of the 2,862 flights dropped in 0.29.0 run again.",
    "BADA3 has new default aircraft and engine pairs.",
    "Staged combustors get a step change in nvPM emissions.",
    "BADA3 looks up each aircraft type's engine in a static table of 250 BADA types, which lacks the types of 114 flights (mostly light and piston aircraft, plus CL35, LJ75 and DHC6). BADA3 fails for them and the benchmark drops them.",
]

[[change]]
release = "0.31.4"
