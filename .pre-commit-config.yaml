repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: python
        entry: ruff format
        files: \.(py|ipynb)$

      - id: ruff-lint
        name: ruff lint
        language: python
        entry: ruff check
        files: \.(py|ipynb)$
        args:
          - --fix
          - --exit-non-zero-on-fix

      - id: doc8
        name: doc8
        language: python
        entry: doc8
        files: \.rst$

      - id: nb-clean
        name: nb-clean
        language: python
        entry: nb-clean clean
        files: ^docs/.*\.ipynb$
        args:
          - --remove-empty-cells
          - --preserve-cell-metadata-field
          - tags
          - --preserve-cell-outputs
          - --preserve-execution-counts
