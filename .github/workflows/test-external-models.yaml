# Run unit tests and integration notebooks for wrappers of external models (ACCF, APCEMM)
# These models are not pycontrails dependencies, so their tests are skipped in test.yaml

name: External model tests

on:
  # Run on push to main and on PRs that touch a wrapper, its tests, its notebook, or this workflow
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-external-models.yaml
      - docs/integrations/ACCF.ipynb
      - docs/integrations/APCEMM.ipynb
      - pycontrails/models/accf.py
      - pycontrails/models/apcemm/**
      - tests/unit/test_accf.py
      - tests/unit/test_apcemm.py

  pull_request:
    paths:
      - .github/workflows/test-external-models.yaml
      - docs/integrations/ACCF.ipynb
      - docs/integrations/APCEMM.ipynb
      - pycontrails/models/accf.py
      - pycontrails/models/apcemm/**
      - tests/unit/test_accf.py
      - tests/unit/test_apcemm.py

  # Allows run manually from the Actions tab
  workflow_dispatch:

  # Run weekly to catch breakage from changes elsewhere in pycontrails or from dependencies
  schedule:
    - cron: '0 6 * * 1'

# disable all permissions at the top level
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event_name }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  accf:
    runs-on: ubuntu-latest

    env:
      PYCONTRAILS_CACHE_DIR: '${{ github.workspace }}/.doc-test-cache'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Download the ERA5 data for the ACCF notebook from pre-cached data on GCP
      - name: pycontrails cache (ERA5 data)
        run: |
          mkdir -p "$PYCONTRAILS_CACHE_DIR"
          gcloud storage cp "gs://contrails-301217-unit-test/doc-test-cache/20220101-*" "$PYCONTRAILS_CACHE_DIR"/

      # climaccf is installed without its dependencies (see pyproject.toml)
      - name: Install pycontrails and climaccf
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[complete]" --group dev --group docs --group accf
          python -m pip install --no-deps --group accf-nodeps

      # test_accf.py skips if climaccf can't be imported, so fail here instead
      - name: Check climaccf import
        run: python -c "import climaccf.accf"

      - name: Test
        run: pytest tests/unit/test_accf.py

      - name: Test notebook
        run: pytest --nbval-lax docs/integrations/ACCF.ipynb

  # The compiler and build steps follow the APCEMM CI workflow
  # https://github.com/MIT-LAE/APCEMM/blob/main/.github/workflows/ci.yml
  apcemm:
    # The vcpkg in APCEMM v1.2.1 (December 2023) predates CMake 4, which fails to build
    # ubuntu-24.04 has CMake 3.x, ubuntu-latest (26.04) has CMake 4
    runs-on: ubuntu-24.04

    env:
      # APCEMM release documented in pycontrails/models/apcemm/apcemm.py
      APCEMM_VERSION: v1.2.1
      # GCC 14 is one of the compilers tested in the APCEMM CI workflow
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pycontrails
          persist-credentials: false

      # The test fixture requires the executable in build/ of the APCEMM checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MIT-LAE/APCEMM
          ref: ${{ env.APCEMM_VERSION }}
          path: APCEMM
          submodules: recursive
          persist-credentials: false

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          "$CXX" --version
          cmake --version

      # vcpkg links the APCEMM dependencies statically, so the executable can be cached alone
      - name: Cache APCEMM executable
        id: cache-apcemm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: APCEMM/build/APCEMM
          key: apcemm-${{ runner.os }}-gcc14-${{ env.APCEMM_VERSION }}

      - name: Build APCEMM
        if: steps.cache-apcemm.outputs.cache-hit != 'true'
        working-directory: APCEMM
        run: |
          cmake -B build -S Code.v05-00 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target APCEMM -j"$(nproc)"

      - name: Add APCEMM to PATH
        run: echo "$GITHUB_WORKSPACE/APCEMM/build" >> "$GITHUB_PATH"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: pycontrails/pyproject.toml

      - name: Install pycontrails
        working-directory: pycontrails
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[complete]" --group dev

      # test_apcemm.py skips if APCEMM is not on the PATH, so fail here instead
      - name: Check APCEMM executable
        run: which APCEMM

      # APCEMM can hang on bad met input
      - name: Test
        working-directory: pycontrails
        timeout-minutes: 15
        run: pytest tests/unit/test_apcemm.py
