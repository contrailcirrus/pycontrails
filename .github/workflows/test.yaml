# Run unit tests from the ground up
# installing "pycontrails" into the Github OS environments

name: Unit tests

on:
  # run on push to main
  push:
    branches:
      - main

  # run on all PRs
  pull_request:

  # Allows run manually from the Actions tab
  workflow_dispatch:
    inputs:
      network:
        description: Run the full test suite, including network tests, on a single python and OS
        type: boolean
        default: false

  # Run full test suite each night, including network tests, for a single python and OS
  schedule:
    - cron: '0 6 * * *'

# Global variables
env:
  PYCONTRAILS_CACHE_DIR: '${{ github.workspace }}/.cache/pycontrails'
  BADA_CACHE_DIR: '${{ github.workspace }}/.cache/bada/'
  CH_AVIATION_ROOT_PATH: '${{ github.workspace }}/.cache/ch-aviation/'

# disable all permissions at the top level
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event_name }} @ ${{ inputs.network }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || inputs.network) && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
        pyversion: ${{ (github.event_name == 'schedule' || inputs.network) && fromJSON('["3.14"]') || fromJSON('["3.12", "3.13", "3.14", "3.15"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.pyversion }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download BADA files
        run: |
          mkdir -p ${{ env.BADA_CACHE_DIR }}
          gcloud storage cp gs://contrails-301217-bada/bada-tar/bada3.tar.gz ${{ env.BADA_CACHE_DIR }}
          gcloud storage cp gs://contrails-301217-bada/bada-tar/bada4.tar.gz ${{ env.BADA_CACHE_DIR }}
          tar xzf ${{ env.BADA_CACHE_DIR }}/bada3.tar.gz -C ${{ env.BADA_CACHE_DIR }}
          tar xzf ${{ env.BADA_CACHE_DIR }}/bada4.tar.gz -C ${{ env.BADA_CACHE_DIR }}
          rm ${{ env.BADA_CACHE_DIR }}/*.tar.gz
          ls -l ${{ env.BADA_CACHE_DIR }}

      - name: Download ch-aviation database files
        run: |
          mkdir -p ${{ env.CH_AVIATION_ROOT_PATH }}
          gcloud storage cp gs://contrails-301217-ch-aviation/20260318_fleet_database_processed.csv ${{ env.CH_AVIATION_ROOT_PATH }}
          gcloud storage cp gs://contrails-301217-ch-aviation/20260318_airline_engine_look_up.csv ${{ env.CH_AVIATION_ROOT_PATH }}
          ls -l ${{ env.CH_AVIATION_ROOT_PATH }}

      - name: Install make - windows
        if: matrix.os == 'windows-latest'
        run: choco install make

      - name: Install pycontrails (dev)
        run: make dev-install

      # https://cloud.google.com/artifact-registry/docs/python/authentication
      - name: Install latest pycontrails-bada
        run: |
          pip install keyring keyrings.google-artifactregistry-auth
          pip install -U -i https://us-central1-python.pkg.dev/contrails-301217/pycontrails/simple pycontrails-bada

      - name: Show environment
        run: |
          pwd
          ls -l .
          ls -l pycontrails
          python --version
          mypy --version
          pip list

      - name: mypy
        run: make mypy

      - name: QC & Test
        shell: bash
        run: |
          pip check
          make lint
          make ${{ (github.event_name == 'schedule' || inputs.network) && 'pytest-network' || 'pytest' }}
