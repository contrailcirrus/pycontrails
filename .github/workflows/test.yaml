# Run unit tests from the ground up
# installing "pycontrails" into the Github OS environments

name: Unit tests

on:
  # run on push to main
  push:
    branches:
      - main

  # run on all PRs
  pull_request:

  # Allows run manually from the Actions tab
  workflow_dispatch:

  # Run if a release is published
  workflow_call:

# Global variables
env:
  PYCONTRAILS_CACHE_DIR: '${{ github.workspace }}/.cache/pycontrails'
  BADA_CACHE_DIR: '${{ github.workspace }}/.cache/bada/'
  CH_AVIATION_ROOT_PATH: '${{ github.workspace }}/.cache/ch-aviation/'
  # Skip LEO satellite data-retrieval tests (slow downloads) in CI
  PYCONTRAILS_SKIP_LEO_TESTS: '1'

# disable all permissions at the top level
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pyversion: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.pyversion }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache mypy and pytest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Note the caches are specific to branches, so we don't need to specify here
          # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
          key: ${{ runner.os }}-mypy-pytest
          path: |
            ${{ github.workspace }}/.mypy_cache
            ${{ github.workspace }}/.pytest_cache

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download BADA files
        run: |
          mkdir -p ${{ env.BADA_CACHE_DIR }}
          gcloud storage cp gs://contrails-301217-bada/bada-tar/bada3.tar.gz ${{ env.BADA_CACHE_DIR }}
          gcloud storage cp gs://contrails-301217-bada/bada-tar/bada4.tar.gz ${{ env.BADA_CACHE_DIR }}
          tar xzf ${{ env.BADA_CACHE_DIR }}/bada3.tar.gz -C ${{ env.BADA_CACHE_DIR }}
          tar xzf ${{ env.BADA_CACHE_DIR }}/bada4.tar.gz -C ${{ env.BADA_CACHE_DIR }}
          rm ${{ env.BADA_CACHE_DIR }}/*.tar.gz
          ls -l ${{ env.BADA_CACHE_DIR }}

      - name: Download ch-aviation database files
        run: |
          mkdir -p ${{ env.CH_AVIATION_ROOT_PATH }}
          gcloud storage cp gs://contrails-301217-ch-aviation/20260318_fleet_database_processed.csv ${{ env.CH_AVIATION_ROOT_PATH }}
          gcloud storage cp gs://contrails-301217-ch-aviation/20260318_airline_engine_look_up.csv ${{ env.CH_AVIATION_ROOT_PATH }}
          ls -l ${{ env.CH_AVIATION_ROOT_PATH }}

      - name: Install make - windows
        if: matrix.os == 'windows-latest'
        run: choco install make

      - name: Install pycontrails (dev)
        run: make dev-install

      # https://cloud.google.com/artifact-registry/docs/python/authentication
      - name: Install latest pycontrails-bada
        run: |
          pip install keyring keyrings.google-artifactregistry-auth
          pip install -U -i https://us-central1-python.pkg.dev/contrails-301217/pycontrails/simple pycontrails-bada

      - name: Show environment
        run: |
          pwd
          ls -l .
          ls -l pycontrails
          python --version
          mypy --version
          pip list

      - name: mypy
        run: make mypy

      - name: QC & Test
        shell: bash
        run: |
          pip check
          make lint
          make pytest
