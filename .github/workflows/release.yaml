# https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml

name: Release

on:
  release:
    types:
      - published

  workflow_dispatch:

# disable all permissions at the top level
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

jobs:
  check-main-test-status:
    runs-on: ubuntu-latest
    steps:
      - name: OS Dependencies
        run: sudo apt-get install -y curl jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check main test status
        run: make main-test-status

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cibuildwheel config in pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-artifact
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist-artifact
          path: dist/*.tar.gz

  # Publish using PyPI trusted publishing
  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  # https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
  publish-to-testpypi:
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/pycontrails
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Unpack artifacts into dist
        run: |
          mkdir -p dist
          mv artifacts/wheels-*-artifact/*.whl dist/
          mv artifacts/sdist-artifact/*.tar.gz dist/
          ls -al dist

      - name: Publish distribution 📦 to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish-to-pypi:
    if: ${{ github.event_name == 'release'}}
    needs:
      - build-wheels
      - build-sdist
      - check-main-test-status
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pycontrails
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Unpack artifacts into dist
        run: |
          mkdir -p dist
          mv artifacts/wheels-*-artifact/*.whl dist/
          mv artifacts/sdist-artifact/*.tar.gz dist/
          ls -al dist

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  run-pycontrails-bada-tests:
    # Run the test workflow in pycontrails-bada after publishing to PyPI
    if: ${{ github.event_name == 'release'}}
    needs:
      - publish-to-pypi

    runs-on: ubuntu-latest
    steps:
      - name: Trigger pycontrails-bada tests
        run: |
          gh api \
          --method POST \
          -H "Accept: application/vnd.github.v3+json" \
          /repos/contrailcirrus/pycontrails-bada/dispatches \
          -f event_type="pycontrails-release"
        env:
          GH_TOKEN: ${{ secrets.GH_ROBOT_USER_PAT }}
